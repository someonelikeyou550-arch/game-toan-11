<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Toán 11</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1d38,#164879);font-family:Arial;color:#172b4d}.wrap{max-width:760px;margin:auto;padding:18px}.hero{text-align:center;color:white;padding:22px 8px}.hero h1{font-size:clamp(26px,5vw,40px)}.card{background:#fff;border-radius:18px;padding:22px;margin:12px 0;box-shadow:0 15px 40px #0004}.field{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin:7px 0 14px}.btn{background:#2563eb;color:white;border:0;padding:14px;border-radius:10px;font-weight:bold;font-size:16px;width:100%;cursor:pointer}.muted{color:#64748b;line-height:1.5;font-size:14px}.hide{display:none}.opt{display:block;padding:14px;border:2px solid #dbe3ef;border-radius:12px;margin:10px 0;cursor:pointer}.opt:has(input:checked){background:#eff6ff;border-color:#2563eb}.meta{display:flex;justify-content:space-between}.bar{height:8px;background:#e5e7eb;border-radius:8px;margin:15px 0}.bar i{display:block;background:#0ea5e9;height:100%;width:0}.question{font-size:20px;font-weight:bold;line-height:1.5;margin:20px 0}.score{font-size:58px;text-align:center;color:#2563eb;font-weight:bold}.err{color:#b45309;background:#fff7ed;padding:10px;border-radius:8px}</style><body><main class="wrap"><header class="hero"><div>📐 TOÁN 11 • HÌNH HỌC KHÔNG GIAN</div><h1>ĐƯỜNG ĐUA SONG SONG</h1><p>Làm bài độc lập – Gửi kết quả cho giáo viên</p></header>
<section id="entry" class="card"><h2>Thông tin học sinh</h2><label>Họ và tên</label><input id="name" class="field" placeholder="Nhập họ tên đầy đủ"><label>Lớp</label><input id="klass" class="field" placeholder="Ví dụ: 11A1"><button class="btn" onclick="start()">BẮT ĐẦU LÀM BÀI</button><p class="muted">10 câu hỏi • 30 giây mỗi câu • Mỗi câu đúng 10 điểm. Kết quả được gửi tới giáo viên khi nộp bài.</p><div id="msg"></div></section>
<section id="quiz" class="card hide"><div class="meta"><b id="count"></b><b>⏱ <span id="time">30</span>s</b></div><div class="bar"><i id="bar"></i></div><div id="question" class="question"></div><div id="options"></div><button class="btn" onclick="next()">CÂU TIẾP THEO</button></section>
<section id="done" class="card hide" style="text-align:center"><div style="font-size:48px">🏆</div><h2>Đã gửi bài thành công!</h2><div id="score" class="score"></div><p id="result"></p><p class="muted">Giáo viên đã nhận được kết quả của bạn.</p></section></main>
<script>
let qs=[],ans=[],i=0,t=30,clock=null,beginAt=0,elapsed=0;
const el=id=>document.getElementById(id);
async function start(){let name=el("name").value.trim(),klass=el("klass").value.trim();if(!name||!klass){el("msg").innerHTML='<p class="err">Hãy nhập họ tên và lớp.</p>';return}let d=await fetch("/api/quiz").then(r=>r.json());if(!d.ready){el("msg").innerHTML='<p class="err">Giáo viên chưa thiết lập đáp án. Vui lòng báo giáo viên.</p>';return}qs=d.questions;ans=Array(qs.length).fill(-1);window.student={name,klass};i=0;elapsed=0;beginAt=Date.now();el("entry").classList.add("hide");el("quiz").classList.remove("hide");render()}
function render(){clearInterval(clock);t=30;el("time").textContent=t;el("count").textContent=`Câu ${i+1}/${qs.length}`;el("bar").style.width=(i/qs.length*100)+"%";el("question").textContent=qs[i].q;let box=el("options");box.innerHTML="";qs[i].opts.forEach((v,j)=>{let lab=document.createElement("label");lab.className="opt";lab.innerHTML=`<input type="radio" name="answer" value="${j}"> ${"ABCD"[j]}. ${v}`;box.append(lab)});clock=setInterval(()=>{t--;el("time").textContent=t;if(t<=0){saveAnswer();goNext()}},1000)}
function saveAnswer(){let c=document.querySelector('input[name="answer"]:checked');if(c)ans[i]=Number(c.value)}
function next(){saveAnswer();goNext()}function goNext(){clearInterval(clock);if(i<qs.length-1){i++;render()}else submit()}
async function submit(){el("quiz").classList.add("hide");let r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:window.student.name,klass:window.student.klass,answers:ans,seconds:Math.round((Date.now()-beginAt)/1000)})});let d=await r.json();el("done").classList.remove("hide");if(!r.ok){el("score").textContent="!";el("result").textContent=d.error;return}el("score").textContent=d.score+"/"+d.total;el("result").textContent=`Bạn trả lời đúng ${d.correct}/${d.count} câu.`}
</script></body></html>
